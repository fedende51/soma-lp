<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOMA Scheduler — film source</title>
<style>
@font-face{font-family:Plex;src:url(assets/ibm-plex-sans-medium.woff2)}@font-face{font-family:Manrope;src:url(assets/manrope.woff2);font-weight:100 900}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fbfcfc}svg#film{width:100%;height:100%;display:block}text{font-family:Manrope,sans-serif;font-weight:500;fill:#003c5b}text.display{font-family:Plex,sans-serif;font-weight:500;letter-spacing:-.045em}text.meta{font-family:Plex,sans-serif;letter-spacing:.07em}#controls{position:fixed;bottom:8px;left:12px;background:#003c5b;color:white;padding:9px 12px;border-radius:8px;font:14px Manrope;display:flex;gap:12px;align-items:center}button,input{font:inherit}button{background:white;color:#003c5b;border:0;border-radius:4px;padding:7px 14px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #00b9c1;outline-offset:3px}input{width:300px}body.render #controls{display:none}
</style>
<svg id="film" xmlns="http://www.w3.org/2000/svg" aria-label="SOMA Scheduler illustrative launch film" role="img"><defs id="defs"></defs><rect id="canvas" fill="#fbfcfc" width="100%" height="100%"/><g id="world"><g id="back"></g><rect id="hero"/><g id="front"></g></g><g id="overlay"></g></svg>
<div id="controls"><button id="play" type="button">Play</button><label>Time <input id="scrub" aria-label="Film time" type="range" min="0" max="30" step=".0166667" value="0"></label><output id="time">0.00</output><a href="deliver/review.html" style="color:white">Exports</a></div>
<script src="film.js"></script></html>
